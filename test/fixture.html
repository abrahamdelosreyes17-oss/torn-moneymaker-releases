<div id="out">running...</div>

<script type="module">
import { buildItemIndex } from '../src/core/items.js';
import { scanDom } from '../src/sources/dom/scan.js';
import { computeOpportunity } from '../src/core/profit.js';
import { rankOpportunities } from '../src/core/ranker.js';
import { injectStyles } from '../src/ui/styles.js';
import { markRows } from '../src/ui/overlay.js';
import { formatMoney } from '../src/core/parse.js';

// Hammer sell_price above the $100 listing, so the profit path is exercised.
const index = buildItemIndex({
    1: { name: 'Hammer', sell_price: 150 },
    206: { name: 'Xanax', sell_price: 540 },
});

const { listings, diagnostics } = scanDom('itemmarket', document, { index });

const priced = listings.map((l) => ({
    ...l,
    npcVerified: true,
    profit: computeOpportunity({
        listingPrice: l.listingPrice,
        exitPrice: l.item.sellPrice,
        qty: l.qty,
        venue: 'NPC',
    }),
})).filter((r) => r.profit && r.profit.profitPerUnit > 0);

const ranked = rankOpportunities(priced, { minTotalProfit: 0 }).map((r) => ({
    ...r,
    cardLabel:
        '+' + formatMoney(r.profit.profitPerUnit) +
        (r.profit.qty > 1
            ? ' x' + r.profit.qty + ' = +' + formatMoney(r.profit.totalProfit)
            : ''),
}));

injectStyles(document);
markRows(ranked, document);

document.getElementById('out').textContent = JSON.stringify({
    diagnostics,
    parsed: listings.map((l) => ({
        name: l.name,
        id: l.itemId,
        price: l.listingPrice,
        qty: l.qty,
        priceAssumed: l.priceAssumed,
        qtyAssumed: l.qtyAssumed,
    })),
    ranked: ranked.map((r) => ({
        name: r.name,
        perUnit: r.profit.profitPerUnit,
        qty: r.profit.qty,
        total: r.profit.totalProfit,
    })),
}, null, 2);
</script>
</body>
