<!doctype html><html><head><meta charset="utf-8"><title>Live feed harness</title></head>
<body style="background:#222;color:#ddd;font:12px monospace">
<div id="out">running... (the feed claims leadership on its first tick and polls on the second, ~6s)</div>
<script>
/*
 * Boots the REAL built userscript on a page that is NOT a Bazaar or the Item
 * Market, with GM_* stubs whose GM_xmlhttpRequest answers from canned Torn
 * API and TornW3B payloads. Checks:
 *   - the live feed finds listings with no market page open
 *   - bazaar rows link to the seller's bazaar
 *   - the Torn key never reaches weav3r.dev
 * Every request URL is recorded in window.__requests.
 */
const _store = {};
const NS = 'tornTrading.v2.';
// Like torn.com: a LIGHT panel colour on :root; dark mode overrides it on <body> only.
document.documentElement.style.setProperty('--default-bg-panel-color', '#f2f2f2');
const KEY = 'abcdefgh12345678';
// The selling page's own keys: a Limited Torn key and a TornExchange key.
const LIMITED = 'LIMITED123456789';
const TEKEY = 'TEKEYabcdefgh123';
_store[NS + 'apiKey'] = JSON.stringify(KEY);
// Defaults only: TornW3B must be on without the user ticking anything.
// ?nofeed=1 turns the live feed and TornW3B off, so only the page's own Torn calls are made.
_store[NS + 'settings'] = JSON.stringify(/[?&]nofeed=1/.test(location.search) ? { liveFeed: false, useW3b: false } : {});
// ?sellkeys=1 boots the selling page with both of its keys already saved.
// ?sellsame=1 saves the SAME Limited key for both, as when you log into
// TornExchange with your Limited key (TornExchange accepts either here).
const SAME = /[?&]sellsame=1/.test(location.search);
if (/[?&]sellkeys=1/.test(location.search)) {
    _store[NS + 'sellKey'] = JSON.stringify(LIMITED);
    _store[NS + 'teKey'] = JSON.stringify(SAME ? LIMITED : TEKEY);
}
// ?w3btrader=1: our trader database already knows trader 77, found on a
// TornW3B page and on no TornExchange list.
if (/[?&]w3btrader=1/.test(location.search)) {
    _store[NS + 'traderDb'] = JSON.stringify({ version: 1, traders: { 77: { name: 'Trader 77', from: 'w3b', seenAt: Date.now(), w3b: null } } });
}
// ?ownbazaar=1: your own bazaar's add page (open it with page=bazaar#/add),
// with a week of recorded prices the way a real player's record looks:
// a few hours each evening with Torn open, nothing in between.
if (/[?&]ownbazaar=1/.test(location.search)) {
    const M5 = 300000, H1 = 3600000, H6 = 21600000, DAY = 86400000, now = Date.now();
    const rec = () => ({ m5: [], h1: [], h6: [], mv: [], seen: now });
    const items = { 206: rec(), 180: rec() };
    const base = { 206: [840000, 846000], 180: [30, 52] };
    for (let t = now - 7 * DAY; t <= now; t += M5) {
        const hour = new Date(t).getHours();
        if (!(hour >= 18 && hour <= 22) && now - t > 2 * H1) continue;
        for (const id of [206, 180]) {
            const wave = Math.sin(t / (9 * H1)) * 0.012 + Math.sin(t / (31 * H1)) * 0.02;
            const im = Math.round(base[id][0] * (1 + wave));
            const bz = Math.round(base[id][1] * (1 + wave * 0.8));
            const r = items[id];
            if (now - t <= DAY) r.m5.push([Math.floor(t / M5), im, bz]);
            for (const [key, ms] of [['h1', H1], ['h6', H6]]) {
                const n = Math.floor(t / ms), arr = r[key];
                let last = arr[arr.length - 1];
                if (!last || last[0] !== n) arr.push(last = [n, null, null, 0, 0]);
                last[1] = last[3] ? Math.round((last[1] * last[3] + im) / (last[3] + 1)) : im; last[3]++;
                last[2] = last[4] ? Math.round((last[2] * last[4] + bz) / (last[4] + 1)) : bz; last[4]++;
            }
        }
    }
    for (let d = 7; d >= 0; d--) {
        items[206].mv.push([Math.floor((now - d * DAY) / DAY), 830000 + d * 1500]);
        items[180].mv.push([Math.floor((now - d * DAY) / DAY), 55]);
    }
    _store[NS + 'priceHistory'] = JSON.stringify({ version: 1, items });
    document.addEventListener('DOMContentLoaded', () => {
        const d = document.createElement('div');
        d.id = 'fake-own';
        d.innerHTML = '<ul class="items-cont">' +
            '<li class="clearfix"><div class="img-wrap"><img src="https://www.torn.com/images/items/180/large.png" alt="Bottle of Beer" width="60"></div><div class="title-wrap"><div class="name-wrap">Bottle of Beer x12</div></div><div class="amount-wrap"><input type="text" class="amount"></div></li>' +
            '<li class="clearfix"><div class="img-wrap"><img src="https://www.torn.com/images/items/206/large.png" alt="Xanax" width="60"></div><div class="title-wrap"><div class="name-wrap">Xanax</div></div><div class="amount-wrap"><input type="text" class="amount"></div></li>' +
            '</ul>';
        document.body.prepend(d);
    });
}
// ?sellprefs=<json> presets the selling page's own preferences.
const _prefs = new URLSearchParams(location.search).get('sellprefs');
if (_prefs) _store[NS + 'sellingPage'] = _prefs;
// ?slow=1 answers profile (status) lookups after 2s, like a slow API.
const SLOW = /[?&]slow=1/.test(location.search);

function GM_getValue(k, d) { return k in _store ? _store[k] : d; }
function GM_setValue(k, v) { _store[k] = v; }
function GM_deleteValue(k) { delete _store[k]; }
function GM_registerMenuCommand() {}
function GM_addValueChangeListener() {}
window.__opened = [];
function GM_openInTab(url) { window.__opened.push(url); }

const NOW_S = Math.floor(Date.now() / 1000);
const ITEMS = {
    1: { name: 'Hammer', sell_price: 100, market_value: 120 },
    206: { name: 'Xanax', sell_price: 600, market_value: 830000 },
    180: { name: 'Bottle of Beer', sell_price: 50, market_value: 55 },
    // "Sell: N/A" in game. Listed cheap on TornW3B - must NEVER appear.
    900: { name: 'Companion Script : Test', sell_price: null, market_value: 10088888 },
    // "Sell: N/A" too: only a foreign shop, whose "sell" is 75% filler.
    335: { name: 'Stick of Dynamite', sell_price: null, foreign: true, market_value: 9172 },
};

window.__requests = [];
function respond(url) {
    const u = new URL(url);
    if (u.hostname === 'api.torn.com') {
        const sel = u.searchParams.get('selections');
        if (u.pathname === '/v2/torn/items') {
            // v2 shape: an array, sell_price null where the game says "Sell: N/A".
            return { items: Object.entries(ITEMS).map(([id, i]) => ({
                id: +id, name: i.name, type: 'Other',
                // Real v2 shape: the NPC price lives in value.shops. The N/A
                // item keeps a bare sell_price but has no shop - like the
                // live Companion Script.
                value: i.foreign
                    ? { vendor: { country: 'China', name: 'General Store' }, shops: [{ country: 'China', shop: 'General Store', buy_price: 50000, sell_price: 37500 }], sell_price: null, market_price: i.market_value }
                    : i.sell_price
                    ? { vendor: { name: 'Test Shop' }, shops: [{ country: 'Torn', shop: 'Test Shop', sell_price: i.sell_price }], sell_price: i.sell_price, market_price: i.market_value }
                    : { vendor: null, shops: [], sell_price: 12000000, market_price: i.market_value },
            })), _metadata: { links: { next: null } } };
        }
        if (u.pathname === '/torn/' && sel === 'items') return { items: ITEMS };
        if (u.pathname === '/torn/' && sel === 'cityshops') {
            return { cityshops: { 1: { name: "Bits 'n' Bobs", inventory: { 1: { price: 90 } } } } };
        }
        if (u.pathname === '/key/') {
            return u.searchParams.get('key') === LIMITED
                ? { access_level: 3, access_type: 'Limited' }
                : { access_level: 1, access_type: 'Public' };
        }
        // Your inventory: Limited key only, two pages.
        if (u.pathname === '/v2/user/inventory') {
            if (u.searchParams.get('key') !== LIMITED) {
                return { error: { code: 16, error: 'Access level of this key is not high enough' } };
            }
            const offset = Number(u.searchParams.get('offset') || 0);
            if (offset === 0) {
                return { inventory: { items: [
                    { id: 206, amount: 12, equipped: false, name: 'Xanax', faction_owned: false, uid: null },
                    { id: 206, amount: 3, equipped: false, name: 'Xanax', faction_owned: false, uid: 7 },
                    // A big stack: worth more as a bundle than a Xanax, less per item.
                    { id: 1, amount: 150000, equipped: false, name: 'Hammer', faction_owned: false, uid: null },
                    { id: 1, amount: 1, equipped: true, name: 'Hammer', faction_owned: false, uid: 8 },
                    { id: 180, amount: 10, equipped: false, name: 'Bottle of Beer', faction_owned: true, uid: null },
                ], timestamp: NOW_S }, _metadata: { links: { next: 'https://api.torn.com/v2/user/inventory?limit=250&offset=250', prev: null }, total: 6 } };
            }
            return { inventory: { items: [
                { id: 180, amount: 2, equipped: false, name: 'Bottle of Beer', faction_owned: false, uid: null },
            ], timestamp: NOW_S }, _metadata: { links: { next: null, prev: null }, total: 6 } };
        }
        const who = u.pathname.match(/^\/v2\/user\/(\d+)\/profile$/);
        // Traders: Bob is online, Alice is not.
        if (who && who[1] === '11') {
            return { profile: { id: 11, name: 'Bob', last_action: { status: 'Online', timestamp: NOW_S }, status: { description: 'Okay', state: 'Okay' } } };
        }
        if (who && who[1] === '12') {
            return { profile: { id: 12, name: 'Alice', last_action: { status: 'Offline', timestamp: NOW_S - 7200 }, status: { description: 'Okay', state: 'Okay' } } };
        }
        if (who && who[1] === '44') {
            return { profile: { id: 44, name: 'Carol', last_action: { status: 'Online', timestamp: NOW_S }, status: { description: 'Okay', state: 'Okay' } } };
        }
        if (who) {
            return { profile: { id: +who[1], name: 'DixieNormousss',
                last_action: { status: 'Offline', timestamp: NOW_S - 3 * 3600, relative: '3 hours ago' },
                status: { description: 'Traveling to Mexico', state: 'Traveling' } } };
        }
        const m = u.pathname.match(/^\/v2\/market\/(\d+)\/itemmarket$/);
        if (m) {
            const listings = m[1] === '180' ? [{ price: 30, amount: 10 }, { price: 58, amount: 4 }] : [{ price: 9999999, amount: 1 }];
            return { itemmarket: { item: { id: +m[1], average_price: 55 }, listings, cache_timestamp: NOW_S - 10, cache_delay: 30 }, _metadata: { total: listings.length } };
        }
        return { error: { code: 0, error: 'unknown in harness: ' + u.pathname } };
    }
    if (u.hostname === 'www.tornexchange.com') {
        if (u.searchParams.get('key') !== TEKEY && !(SAME && u.searchParams.get('key') === LIMITED)) return { status: 'error', message: 'Invalid API key', __http: 401 };
        if (u.pathname === '/api/all_best_listings') {
            return { status: 'success', data: {
                1: { item: 'Hammer', traders: [
                    { trader: 'Alice', trader_id: 12, price: 115, vote_score: 40 },
                    { trader: 'Bob', trader_id: 11, price: 110, vote_score: 214 },
                ] },
                206: { item: 'Xanax', traders: [{ trader: 'Bob', trader_id: 11, price: 850000, vote_score: 214 }] },
            } };
        }
        if (u.pathname === '/api/listings') {
            const id = u.searchParams.get('item_id');
            const listings = id === '206'
                ? [{ trader: 'Bob', price: 850000, item: 'Xanax' }, { trader: 'Carol', price: 845000, item: 'Xanax' }, { trader: 'Alice', price: 830000, item: 'Xanax' }]
                : id === '1'
                  ? [{ trader: 'Alice', price: 115, item: 'Hammer' }, { trader: 'Bob', price: 110, item: 'Hammer' }, { trader: 'Dave', price: 105, item: 'Hammer' }]
                  : [];
            return { status: 'success', data: { item: 'x', meta: { total_listings: listings.length, total_pages: 1, current_page: 1 }, listings } };
        }
        if (u.pathname === '/api/active_traders') {
            return { status: 'success', data: { ids: [11, 12, 44], verbose: {
                11: { name: 'Bob', torn_id: 11, last_trade: NOW_S },
                12: { name: 'Alice', torn_id: 12, last_trade: NOW_S },
                44: { name: 'Carol', torn_id: 44, last_trade: null },
            } } };
        }
        return { status: 'error', message: 'Endpoint not found', __http: 404 };
    }
    if (u.hostname === 'weav3r.dev') {
        if (u.pathname === '/api/marketplace') {
            return { items: [
                { item_id: 1, item_name: 'Hammer', lowest_price: 50, market_price: 120, total_bazaars: 3 },
                { item_id: 206, item_name: 'Xanax', lowest_price: 840000, market_price: 830000 },
                { item_id: 900, item_name: 'Companion Script : Test', lowest_price: 5, market_price: 10088888 },
                { item_id: 335, item_name: 'Stick of Dynamite', lowest_price: 17500, market_price: 9172 },
            ] };
        }
        if (u.pathname === '/api/marketplace/1') {
            return { total_listings: 3, listings: [
                { player_id: 42, player_name: 'Sponsored', price: 95, quantity: 1, last_checked: NOW_S - 20, sponsored: 1 },
                { player_id: 777, player_name: 'CheapSeller', price: 50, quantity: 4, last_checked: NOW_S - 30 },
                { player_id: null, price: 10, quantity: 99, last_checked: NOW_S },
                { player_id: 555, player_name: 'OldNews', price: 40, quantity: 9, last_checked: NOW_S - 3600 },
            ] };
        }
        if (u.pathname === '/api/marketplace/206') {
            return { total_listings: 1, listings: [{ player_id: 888, player_name: 'XanSeller', price: 840000, quantity: 2, last_checked: NOW_S - 15 }] };
        }
        if (u.pathname === '/api/marketplace/335') {
            return { total_listings: 1, listings: [{ player_id: 2, player_name: 'Y', price: 17500, quantity: 53, last_checked: NOW_S }] };
        }
        if (u.pathname === '/api/marketplace/900') {
            return { total_listings: 1, listings: [{ player_id: 1, player_name: 'X', price: 5, quantity: 3, last_checked: NOW_S }] };
        }
        // Traders' own price lists: Bob pays more here than on TornExchange;
        // Alice has no TornW3B list; trader 77 is only on TornW3B.
        const pl = u.pathname.match(/^\/api\/pricelist\/(\d+)$/);
        if (pl) {
            const lists = {
                11: [{ itemId: 206, name: 'Xanax', buyPrice: 852000 }, { itemId: 1, name: 'Hammer', buyPrice: 0 }, { itemId: -1, name: 'Flower Set', buyPrice: 300000 }],
                44: [{ itemId: 1, name: 'Hammer', buyPrice: 118 }],
                77: [{ itemId: 206, name: 'Xanax', buyPrice: 849500 }, { itemId: 180, name: 'Bottle of Beer', buyPrice: 61 }, { itemId: 335, name: 'Stick of Dynamite', buyPrice: 9000 }],
            };
            return lists[pl[1]] || { error: 'Pricelist not found for this user', __http: 404 };
        }
        return { total_listings: 0, listings: [] };
    }
    throw new Error('Unexpected host ' + u.hostname);
}
function GM_xmlhttpRequest(opts) {
    window.__requests.push(opts.url);
    setTimeout(() => {
        try {
            const body = respond(opts.url);
            opts.onload({ status: (body && body.__http) || 200, responseText: JSON.stringify(body) });
        } catch (e) {
            opts.onerror(e);
        }
    }, SLOW && /\/v2\/user\/\d+\/profile/.test(opts.url) ? 2000 : 5);
}
window.onerror = (m) => { document.getElementById('out').textContent = 'BOOT ERROR: ' + m; };
</script>
<script>
// Always the build just made, never a cached copy.
document.write('<script src="../torn-moneymaker.user.js?v=' + Date.now() + '"><' + '/script>');
</script>
<script>
// The panel is in a shadow root; look inside it.
const $p = (sel) => (document.getElementById('ttv2-host') || {}).shadowRoot?.querySelector(sel);
const $$p = (sel) => [...((document.getElementById('ttv2-host') || {}).shadowRoot?.querySelectorAll(sel) || [])];
setTimeout(() => {
  const out = document.getElementById('out');
  if (out.textContent.startsWith('BOOT ERROR')) return;
  const rows = [...$$p('.ttv2-row')].map(r => r.innerText.replace(/\n+/g, ' / '));
  const w3b = window.__requests.filter(u => u.includes('weav3r.dev'));
  out.textContent = JSON.stringify({
    live: ($p('.ttv2-live') || {}).textContent,
    tabs: [...$$p('.ttv2-tab')].map(b => b.textContent + (b.classList.contains('ttv2-tab-on') ? ' *' : '')),
    status: ($p('.ttv2-status') || {}).textContent,
    rows,
    tosTable: $$p('.ttv2-tos tr').length,
    keyInputValue: ($p('.ttv2-settings input') || {}).value,
    requests: window.__requests.map(u => u.replace(KEY, '<KEY>').replace(LIMITED, '<LIMITED>').replace(TEKEY, '<TEKEY>')),
    keyEverSentToW3b: w3b.some(u => u.includes(KEY) || u.includes(LIMITED)),
    naItemShown: $$p('.ttv2-row').some(r => /Companion Script|Stick of Dynamite/.test(r.textContent)),
    rowsSeen: $$p('.ttv2-row').length,
  }, null, 1);
  window.__done = true;
}, 12000);
</script>
</body></html>
