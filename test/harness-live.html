<!doctype html><html><head><meta charset="utf-8"><title>Live feed harness</title></head>
<body style="background:#222;color:#ddd;font:12px monospace">
<div id="out">running... (the feed claims leadership on its first tick and polls on the second, ~6s)</div>
<script>
/*
 * Boots the REAL built userscript on a page that is NOT a Bazaar or the Item
 * Market, with GM_* stubs whose GM_xmlhttpRequest answers from canned Torn
 * API and TornW3B payloads. Checks:
 *   - the live feed finds listings with no market page open
 *   - bazaar rows link to the seller's bazaar
 *   - the Torn key never reaches weav3r.dev
 * Every request URL is recorded in window.__requests.
 */
const _store = {};
const NS = 'tornTrading.v2.';
// Like torn.com: a LIGHT panel colour on :root; dark mode overrides it on <body> only.
document.documentElement.style.setProperty('--default-bg-panel-color', '#f2f2f2');
const KEY = 'abcdefgh12345678';
// The selling page's own keys: a Limited Torn key and a TornExchange key.
const LIMITED = 'LIMITED123456789';
const TEKEY = 'TEKEYabcdefgh123';
_store[NS + 'apiKey'] = JSON.stringify(KEY);
// Defaults only: TornW3B must be on without the user ticking anything.
// ?nofeed=1 turns the live feed and TornW3B off, so only the page's own Torn calls are made.
_store[NS + 'settings'] = JSON.stringify(/[?&]nofeed=1/.test(location.search) ? { liveFeed: false, useW3b: false } : {});
// ?sellkeys=1 boots the selling page with both of its keys already saved.
// ?sellsame=1 saves the SAME Limited key for both, as when you log into
// TornExchange with your Limited key (TornExchange accepts either here).
const SAME = /[?&]sellsame=1/.test(location.search);
if (/[?&]sellkeys=1/.test(location.search)) {
    _store[NS + 'sellKey'] = JSON.stringify(LIMITED);
    // &tebad=1: a TornExchange key it rejects ("Invalid API key").
    _store[NS + 'teKey'] = JSON.stringify(/[?&]tebad=1/.test(location.search) ? 'WRONGKEY12345678' : SAME ? LIMITED : TEKEY);
}
// ?ledgerkey=1: the Torn Ledger's Full key already saved (its log answers below).
const FULLKEY = 'FULLKEY123456789';
if (/[?&]ledgerkey=1/.test(location.search)) _store[NS + 'ledgerKey'] = JSON.stringify(FULLKEY);
// ?w3btrader=1: our trader database already knows trader 77, found on a
// TornW3B page and on no TornExchange list.
if (/[?&]w3btrader=1/.test(location.search)) {
    _store[NS + 'traderDb'] = JSON.stringify({ version: 1, traders: { 77: { name: 'Trader 77', from: 'w3b', seenAt: Date.now(), w3b: null } } });
}
// ?ownbazaar=1: your own bazaar's add page (open it with page=bazaar#/add),
// with a week of recorded prices the way a real player's record looks:
// a few hours each evening with Torn open, nothing in between.
if (/[?&]ownbazaar=1/.test(location.search)) {
    const M5 = 300000, H1 = 3600000, H6 = 21600000, DAY = 86400000, now = Date.now();
    const rec = () => ({ m5: [], h1: [], h6: [], mv: [], seen: now });
    const items = { 206: rec(), 180: rec() };
    const base = { 206: [840000, 846000], 180: [30, 52] };
    for (let t = now - 7 * DAY; t <= now; t += M5) {
        const hour = new Date(t).getHours();
        if (!(hour >= 18 && hour <= 22) && now - t > 2 * H1) continue;
        for (const id of [206, 180]) {
            const wave = Math.sin(t / (9 * H1)) * 0.012 + Math.sin(t / (31 * H1)) * 0.02;
            const im = Math.round(base[id][0] * (1 + wave));
            const bz = Math.round(base[id][1] * (1 + wave * 0.8));
            const r = items[id];
            if (now - t <= DAY) r.m5.push([Math.floor(t / M5), im, bz]);
            for (const [key, ms] of [['h1', H1], ['h6', H6]]) {
                const n = Math.floor(t / ms), arr = r[key];
                let last = arr[arr.length - 1];
                if (!last || last[0] !== n) arr.push(last = [n, null, null, 0, 0]);
                last[1] = last[3] ? Math.round((last[1] * last[3] + im) / (last[3] + 1)) : im; last[3]++;
                last[2] = last[4] ? Math.round((last[2] * last[4] + bz) / (last[4] + 1)) : bz; last[4]++;
            }
        }
    }
    for (let d = 7; d >= 0; d--) {
        items[206].mv.push([Math.floor((now - d * DAY) / DAY), 830000 + d * 1500]);
        items[180].mv.push([Math.floor((now - d * DAY) / DAY), 55]);
    }
    _store[NS + 'priceHistory'] = JSON.stringify({ version: 1, items });
    document.addEventListener('DOMContentLoaded', () => {
        const row = (id, name, have, value, weapon) => '<li class="clearfix"><div class="thumbnail-wrap"><div class="item-amount qty">' + (have || 1) + '</div></div>' +
            '<div class="title-wrap"><div class="image-wrap"><img src="https://www.torn.com/images/items/' + id + '/large.png" alt="' + name + '"></div><div class="name-wrap bold"><span class="t-overflow">' + name + '</span>' + (have ? ' x' + have : '') + '</div></div>' +
            '<div class="actions-main-wrap clearfix"><div class="amount-main-wrap">' +
            (weapon ? '<div class="amount choice-container"><input class="checkbox-css" type="checkbox" name="amount"></div>' : '<div class="amount"><input type="text" class="clear-all" placeholder="Qty"></div>') +
            '<div class="price"><div class="input-money-group"><input type="text" class="clear-all input-money" placeholder="Price"><input type="hidden" name="price" class="clear-all input-money"></div></div></div>' +
            // &ttvalues=1: another script's "| 2x = $total" after Torn's price (the friend's page, 2026-10-02).
            '<div class="info-main-wrap"><div class="info-wrap t-overflow">$' + value.toLocaleString('en-US') + (have > 1 && /[?&]ttvalues=1/.test(location.search) ? ' | ' + have + 'x = $' + (have * value).toLocaleString('en-US') : '') + '</div></div></div></li>';
        const d = document.createElement('div');
        d.id = 'fake-own';
        d.innerHTML = '<input type="hidden" id="torn-user" value=\'{"id":999,"playername":"Me"}\'>' +
            '<div class="topSection___x"><div class="linksContainer____x"><a class="linkContainer___x inRow___x iconActive___x" href="#/manage">Manage items</a><a class="linkContainer___x inRow___x" href="#/personalize">Personalize</a></div></div>' +
            '<style>#fake-own ul{width:784px;list-style:none;padding:0;background:#2e2e2e;font:12px Arial;color:#ddd}#fake-own li{overflow:hidden;border-bottom:1px solid #444}#fake-own .title-wrap{float:left;width:283px}#fake-own .image-wrap{float:left;width:64px;height:32px}#fake-own .image-wrap img{height:30px}#fake-own .name-wrap{float:left;width:218px;line-height:32px;font-weight:bold}#fake-own .info-main-wrap{float:left;width:325px}#fake-own .info-wrap{line-height:32px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#fake-own .amount-main-wrap{float:right;width:175px}#fake-own .amount{float:left;width:63px;padding-top:5px}#fake-own .amount input{width:41px}#fake-own .price{float:left;width:111px;padding-top:5px}#fake-own .price input[type=text]{width:89px}</style>' +
            '<ul class="items-cont">' +
            row(180, 'Bottle of Beer', 12, 55) +
            row(206, 'Xanax', 15, 830000) +
            row(1, 'Hammer', 0, 120, true) +
            '</ul>';
        document.body.prepend(d);
        // On the trade page (page=trade), as read on the real one: the info
        // cell is hidden, and each category tab has its own list after All
        // (only the tab you are on shows).
        if (/[?&]page=trade/.test(location.search)) {
            // Torn's bar above the lists (as on the friend's page, 2026-09-28).
            d.querySelector('ul.items-cont').insertAdjacentHTML('beforebegin', '<div class="add-bar" style="padding:8px"><button type="button" class="torn-btn">ADD TO TRADE</button> <span>You are adding 0 items across 0 categories</span> <a href="#clear">Clear all</a></div>');
            d.querySelector('ul.items-cont').classList.add('all-items');
            d.insertAdjacentHTML('beforeend', '<style>#fake-own .info-wrap{display:none}</style><ul class="items-cont drugs-items" style="display:none">' + row(206, 'Xanax', 15, 830000) + '</ul>');
        }
        // Torn's form keeps what was typed; the harness logs each input event so a check can see Fill's.
        window.__typed = [];
        d.addEventListener('input', (e) => window.__typed.push([e.target.closest('li') ? e.target.closest('li').querySelector('.t-overflow').textContent : '?', e.target.className, e.target.value]));
    });
}
// ?ownmarket=add|view: the Item Market's add-listing / your-listings rows.
const _ownMarket = new URLSearchParams(location.search).get('ownmarket');
if (_ownMarket) {
    document.addEventListener('DOMContentLoaded', () => {
        const d = document.createElement('div');
        d.id = 'item-market-root';
        const row = (id, name, have, price) => '<div class="itemRowWrapper___x1"><div class="itemRow___x2"><div class="info___x3">' +
            '<button type="button" class="viewInfoButton___x4" aria-controls="item-info-' + id + '-0"><img src="https://www.torn.com/images/items/' + id + '/small.png" alt=""></button>' +
            '<span class="name___x5">' + name + (have ? ' x' + have : '') + '</span></div>' +
            (_ownMarket === 'add' ? '<div class="amountInputWrapper___x6"><div class="input-money-group"><input class="input-money" type="text"><input class="input-money" type="hidden"></div></div>' : '') +
            '<div class="priceInputWrapper___x7"><div class="input-money-group"><span class="input-money-symbol">$</span><input class="input-money" type="text" value="' + (price || '') + '"><input class="input-money" type="hidden" value="' + (price || '') + '"></div></div>' +
            '</div></div>';
        d.innerHTML = '<input type="hidden" id="torn-user" value=\'{"id":999,"playername":"Me"}\'>' +
            (_ownMarket === 'add' ? row(206, 'Xanax', 15) + row(180, 'Bottle of Beer', 12) : row(206, 'Xanax', 0, 845000));
        document.body.prepend(d);
        window.__typed = [];
        d.addEventListener('input', (e) => window.__typed.push([e.target.closest('[class*=itemRow___]').querySelector('[class*=name___]').textContent, e.target.className, e.target.value]));
    });
}
// ?page=profile&XID=<id>: a player's profile with its Actions buttons (as read
// on the real page, 2026-09-28: Start chat is a button with no link);
// &chatwanted=1: Chat was pressed for that player in Torn Bids.
if (/[?&]page=profile/.test(location.search)) {
    const _xid = new URLSearchParams(location.search).get('XID') || '5001';
    if (/[?&]chatwanted=1/.test(location.search)) _store[NS + 'chatWanted'] = JSON.stringify({ id: _xid, name: 'KayMalta', at: Date.now() });
    document.addEventListener('DOMContentLoaded', () => {
        const d = document.createElement('div');
        d.innerHTML = '<div class="profile-buttons" style="display:flex;gap:6px;padding:40px">' +
            '<a id="button1-profile-' + _xid + '" class="profile-button profile-button-sendMessage active" aria-label="Private message" href="#mail">mail</a>' +
            '<button id="button2-profile-' + _xid + '" class="profile-button profile-button-initiateChat active withoutLink" aria-label="Start chat">chat</button></div>';
        document.body.prepend(d);
    });
}
// &tradeview=<name>: Torn's trade view (as read on the real page, 2026-09-27)
// with that partner; &offer=<n> their money; &inside=<Name:qty,Name:qty> yours.
const _tradeView = new URLSearchParams(location.search).get('tradeview');
if (_tradeView) {
    document.addEventListener('DOMContentLoaded', () => {
        const q = new URLSearchParams(location.search);
        const offer = Number(q.get('offer') || 0);
        const inside = (q.get('inside') || '').split(',').filter(Boolean).map((p) => p.split(':'));
        const d = document.createElement('div');
        d.innerHTML = '<div class="trade-cont"><div class="t-title">Trade between Me and ' + _tradeView + '</div>' +
            '<div class="user left"><div class="title-black"><div class="title-divider">Me</div></div><ul class="cont">' +
            '<li class="color1"><ul class="desc"><li class="last"><div class="name left inactive">No money in trade</div></li></ul></li>' +
            '<li class="color2"><ul class="desc">' + (inside.length ? inside.map(([n, x]) => '<li><div class="name left">' + n + ' x' + x + '</div></li>').join('') : '<li class="last"><div class="name left inactive">No items in trade</div></li>') + '</ul></li>' +
            '<li class="color3 last"><ul class="desc"><li class="last"><div class="name left inactive">No properties in trade</div></li></ul></li></ul></div>' +
            '<div class="user right"><div class="title-black">' + _tradeView + '</div><ul class="cont">' +
            '<li class="color1"><ul class="desc"><li class="last"><div class="name left">' + (offer ? '$' + offer.toLocaleString('en-US') : 'No money in trade') + '</div></li></ul></li></ul></div></div>';
        document.body.prepend(d);
    });
}
// &bazaarcards=1 (with page=bazaar&userId=<seller>): a player's bazaar with
// Stick of Dynamite ($17,500, 60 in stock) and Xanax ($840,000, 2 in stock).
// window.__buy(id, n) takes n off a listing's stock, as a purchase does.
if (/[?&]bazaarcards=1/.test(location.search)) {
    document.addEventListener('DOMContentLoaded', () => {
        const card = (id, name, price, stock) => '<div class="itemDescription___x" data-id="' + id + '" style="width:220px;height:110px;display:inline-block;margin:4px;padding:6px;background:#333;color:#ddd;font:12px Arial">' +
            '<img src="https://www.torn.com/images/items/' + id + '/large.png" alt="' + name + '" style="height:30px"><div>' + name + '</div><div>$' + price.toLocaleString('en-US') + '</div><div class="stock">(' + stock + ' in stock)</div>' +
            // A quantity box and Buy, as a card shows once you press to buy (Fill types into the box).
            '<div style="margin-top:4px"><input class="buyAmountInput" type="text" placeholder="Qty" style="width:60px"> <button type="button">Buy</button></div></div>';
        const d = document.createElement('div');
        d.id = 'fake-bazaar';
        d.innerHTML = card(335, 'Stick of Dynamite', 17500, 60) + card(206, 'Xanax', 840000, 2);
        document.body.prepend(d);
        window.__buy = (id, n) => {
            const c = d.querySelector('[data-id="' + id + '"]');
            const s = c.querySelector('.stock');
            const left = Number(s.textContent.replace(/\D/g, '')) - n;
            if (left > 0) s.textContent = '(' + left + ' in stock)';
            else c.remove();
        };
    });
}
// &bazaarwindow=<n> (with page=bazaar&userId=<seller>): a player's bazaar laid
// out as Torn's is (read on real bazaars, 2026-10-02): n listings in rows of
// three, 80px a row, the list as tall as all of them, and only the rows near
// the screen in the page - rows scrolled away from are taken out. Its search
// box filters by name. &want=<k>: Xanax ($840,000, 5 in stock) is listing k
// (none without it). &buyplan=1: Bob accepted a trade a minute ago with a step
// for 2 Xanax at this seller (and one more at another).
// window.__buy(id, n) takes n off a listing, as a purchase does.
const _bzWindow = Number(new URLSearchParams(location.search).get('bazaarwindow')) || 0;
const BZW_ITEMS = {};
if (_bzWindow) {
    const q = new URLSearchParams(location.search);
    const want = q.has('want') ? Number(q.get('want')) : -1;
    const seller = q.get('userId') || '777';
    for (let i = 0; i < _bzWindow; i++) BZW_ITEMS[3000 + i] = { name: 'Thing ' + (i + 1), type: 'Other', sell_price: 10, market_value: 400 };
    if (/[?&]buyplan=[12]/.test(location.search)) {
        const now = Date.now();
        _store[NS + 'sellAccepted'] = JSON.stringify({ 'id:11': { key: 'id:11', trader: { id: '11', name: 'Bob' }, itemId: '206', at: now - 60000, cost: 2521000, pays: 2550000, profit: 29000, items: [
            { line: 'flip:206', itemId: '206', name: 'Xanax', units: 3, bid: 850000, kind: 'flip', sent: false, steps: [
                { sellerId: seller, sellerName: 'BigSeller', qty: 2, price: 840000, bought: false },
                { sellerId: '4242', sellerName: 'Other', qty: 1, price: 841000, bought: false },
            ] },
            // &buyplan=2: and 2 of Thing 2 at this same seller, so Next stays on this page.
            ...(/[?&]buyplan=2/.test(location.search) ? [{ line: 'flip:3001', itemId: '3001', name: 'Thing 2', units: 2, bid: 600, kind: 'flip', sent: false, steps: [{ sellerId: seller, sellerName: 'BigSeller', qty: 2, price: 501, bought: false }] }] : []),
        ] } });
    }
    document.addEventListener('DOMContentLoaded', () => {
        const ROW = 80, OVER = 10;
        let data = [];
        for (let i = 0; i < _bzWindow; i++) data.push(i === want ? { id: 206, name: 'Xanax', price: 840000, stock: 5 } : { id: 3000 + i, name: 'Thing ' + (i + 1), price: 500 + i, stock: 3 });
        const d = document.createElement('div');
        d.id = 'fake-bazaar';
        d.innerHTML = '<div style="height:120px;padding:8px;color:#ddd;font:12px Arial">BigSeller\'s bazaar <div class="searchBar___x"><input type="text" placeholder="search..." aria-label="Search bazaar" style="width:160px"></div></div>' +
            '<div class="itemsContainner___x" style="width:700px"><div><div data-testid="bazaar-items" style="position: relative; width: 100%; height: 0px;"></div></div></div>';
        document.body.prepend(d);
        const list = d.querySelector('[data-testid="bazaar-items"]');
        const search = d.querySelector('input');
        const card = (x) => '<div class="item___x" data-testid="item" style="display:inline-block;width:220px;height:72px;margin:2px;background:#333;color:#ddd;font:12px Arial;vertical-align:top;position:relative"><div class="itemDescription___x" data-testid="item-description" data-id="' + x.id + '">' +
            '<div class="imgBar___x" role="button" aria-label="' + x.name + '"><div data-testid="img-container"><img class="item-plate" alt="' + x.name + '" src="https://www.torn.com/images/items/' + x.id + '/large.png" style="height:24px"></div></div>' +
            '<div data-testid="description"><p data-testid="name" class="name___x" style="margin:0">' + x.name + '</p><div data-testid="price" class="price___x">$' + x.price.toLocaleString('en-US') + '</div>' +
            '<p class="amount___x" style="margin:0">(<span data-testid="amount-value">' + x.stock + '</span> in stock)</p></div></div></div>';
        const shown = () => (search.value.trim() ? data.filter((x) => x.name.toLowerCase().includes(search.value.trim().toLowerCase())) : data);
        const draw = (fresh) => {
            const rows = shown();
            const total = Math.ceil(rows.length / 3);
            list.style.height = total * ROW + 'px';
            const top = list.getBoundingClientRect().top;
            const from = Math.max(0, Math.floor(-top / ROW) - OVER);
            const to = Math.min(total - 1, Math.floor((-top + innerHeight) / ROW) + OVER);
            if (fresh) list.textContent = '';
            const have = new Map([...list.children].map((r) => [Number(r.dataset.i), r]));
            for (const [i, r] of have) if (i < from || i > to) r.remove();
            for (let i = from; i <= to; i++) {
                if (have.has(i)) continue;
                const r = document.createElement('div');
                r.dataset.i = i;
                r.setAttribute('data-testid', 'bazaar-items-row');
                r.setAttribute('style', 'position: absolute; inset: 0px; height: ' + ROW + 'px; transform: translateY(' + i * ROW + 'px);');
                r.innerHTML = '<div data-testid="row-items">' + rows.slice(i * 3, i * 3 + 3).map(card).join('') + '</div>';
                list.appendChild(r);
            }
        };
        draw(true);
        // &ttbusy=1 (3.17.0, the speed bench): another extension writing into every card twice a
        // second, as TornTools does into Torn's rows - each write is a change in the rows we watch.
        if (/[?&]ttbusy=1/.test(location.search)) {
            let n = 0;
            setInterval(() => {
                n += 1;
                for (const c of list.querySelectorAll('[data-testid="item-description"]')) {
                    let s = c.querySelector('.tt-fake');
                    if (!s) {
                        s = document.createElement('span');
                        s.className = 'tt-fake';
                        c.appendChild(s);
                    }
                    s.textContent = 'tt ' + n;
                }
            }, 500);
        }
        window.addEventListener('scroll', () => draw(false), { passive: true });
        // A background preview fires no scroll events: a check calls this after scrollTo().
        window.__draw = () => draw(false);
        search.addEventListener('input', () => draw(true));
        window.__buy = (id, n) => {
            const x = data.find((y) => y.id === id);
            if (!x) return;
            x.stock -= n;
            if (x.stock <= 0) data = data.filter((y) => y !== x);
            draw(true);
        };
        // Sorted another way (Torn's Name / Cost tabs): the same listings, another order.
        window.__sort = () => { data = [...data].reverse(); draw(true); };
    });
}
// ?from381=1: left as 3.8.1 left it when it refused the Limited key as the
// TornExchange key - the Limited key saved, no TornExchange key, and its
// refusal message still stored.
if (/[?&]from381=1/.test(location.search)) {
    _store[NS + 'sellKey'] = JSON.stringify(LIMITED);
    _store[NS + 'teState'] = JSON.stringify({ error: 'That is a Torn key. Paste the key from tornexchange.com.' });
}
// ?tornlayout=1: a Torn-like page - content centred in a 976px column - to
// check the panel docks beside it without covering it.
if (/[?&]tornlayout=\d/.test(location.search)) {
    document.addEventListener('DOMContentLoaded', () => {
        const c = document.createElement('div');
        c.className = 'content-wrapper';
        // ?tornlayout=1: 976px, centred. ?tornlayout=<n> (n > 1): content up to n px from the right edge.
        const gutter = Number(new URLSearchParams(location.search).get('tornlayout'));
        c.style.cssText = (gutter > 1 ? 'width:calc(100% - ' + gutter + 'px);margin:0;' : 'width:976px;margin:0 auto;') + 'min-height:600px;background:#333;color:#ddd;padding:16px;box-sizing:border-box';
        c.textContent = 'Torn content. The panel must never cover this box.';
        document.body.prepend(c);
    });
}
// ?traders=1: TornExchange's top buyers already stored, as the traders page
// leaves them: Bob (Trusted, 214 votes) pays $110 for a Hammer, Alice
// (Known) $115 - so a player's bazaar tags a cheaper Hammer with Bob only.
if (/[?&]traders=1/.test(location.search)) {
    _store[NS + 'teCache'] = JSON.stringify({ version: 1, fetchedAt: Date.now(), items: {
        1: [['Alice', '12', 115, 40], ['Bob', '11', 110, 214]],
        206: [['Bob', '11', 850000, 214]],
    } });
}
// ?sellprefs=<json> presets the selling page's own preferences.
const _prefs = new URLSearchParams(location.search).get('sellprefs');
if (_prefs) _store[NS + 'sellingPage'] = _prefs;
// ?awake=1: the page reports itself visible even in a background preview,
// where the traders page would otherwise (rightly) pause every request.
if (/[?&]awake=1/.test(location.search)) {
    Object.defineProperty(document, 'visibilityState', { get: () => 'visible' });
}
// ?slow=1 answers profile (status) lookups after 2s, like a slow API.
const SLOW = /[?&]slow=1/.test(location.search);
const TESLOW = /[?&]teslow=1/.test(location.search);

function GM_getValue(k, d) { return k in _store ? _store[k] : d; }
function GM_setValue(k, v) { _store[k] = v; }
function GM_deleteValue(k) { delete _store[k]; }
function GM_registerMenuCommand() {}
function GM_addValueChangeListener() {}
window.__opened = [];
function GM_openInTab(url) { window.__opened.push(url); }

const NOW_S = Math.floor(Date.now() / 1000);
/*
